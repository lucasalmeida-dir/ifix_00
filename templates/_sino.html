{% if user.is_authenticated %}
<div class="dropdown sino ms-auto me-2 ms-lg-2 order-lg-last" data-sino-url="{% url 'services:sino_menu' %}" data-sino-assinatura="{{ sino_assinatura }}">
    <button class="sino-btn" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" aria-label="Notificações">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="badge text-bg-danger sino-badge" data-live="sino" {% if not sino_total %}hidden{% endif %}>{{ sino_total }}</span>
    </button>
    <div class="dropdown-menu dropdown-menu-end sino-menu">
        {% include "_sino_menu.html" %}
    </div>
</div>
{% endif %}
