{% extends "base.html" %}
{% block title %}Excluir serviço{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <h2 class="mb-3">Excluir serviço?</h2>
        <p class="text-muted">Tem certeza de que deseja excluir o serviço "<strong>{{ servico.nome }}</strong>"? Esta ação não pode ser desfeita.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sim, excluir</button>
            <a href="{% url 'services:meus_servicos' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
