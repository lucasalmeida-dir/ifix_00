{% extends "base.html" %}
{% block title %}Recuperar senha{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-3">Recuperar senha</h2>
        <p class="text-muted">Informe seu e-mail cadastrado para receber as instruções de redefinição.</p>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field.errors }}
                    <div>{{ field }}</div>
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100">Enviar instruções</button>
        </form>
    </div>
</div>
{% endblock %}
