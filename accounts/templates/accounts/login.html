{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-4">Entrar</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field.errors }}
                    <div>{{ field }}</div>
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        <div class="mt-3 d-flex justify-content-between">
            <a href="{% url 'accounts:password_reset' %}">Esqueci minha senha</a>
            <a href="{% url 'accounts:register_user' %}">Criar conta</a>
        </div>
    </div>
</div>
{% endblock %}
