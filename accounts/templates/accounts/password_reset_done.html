{% extends "base.html" %}
{% block title %}Instruções enviadas{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <h2 class="mb-3">Verifique seu e-mail</h2>
        <p class="text-muted">
            Se o e-mail informado existir em nossa base, enviamos um link com instruções
            para redefinir sua senha.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary">Voltar para o login</a>
    </div>
</div>
{% endblock %}
